<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animación Loop IA</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Oswald:wght@700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
  body {
    background: #2a1b5c;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .container {
    position: relative;
    font-size: 3.5em;
    perspective: 1000px;
    text-align: center;
    line-height: 1.4;
  }

  .letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(100px) scale(0);
    animation-fill-mode: forwards;
  }

  .souleducation {
    font-family: "Permanent Marker", cursive;
    letter-spacing: 0.05em;
    color: #0ff;
    text-shadow: 0 0 10px #0ff, 0 0 20px #f0f, 0 0 40px #0ff;
  }

  .jamiroquai {
    font-family: 'Oswald', sans-serif;
    letter-spacing: 0.1em;
    color: #ff0040;
    text-shadow: 0 0 10px #ff0040, 0 0 20px #ff0080, 0 0 40px #ff0040;
  }

  .cocreada {
    font-family: 'Orbitron', sans-serif;
    color: #aaff00; /* verde lima */
    text-shadow: 
      0 0 10px #aaff00,
      0 0 20px #00ff80,
      0 0 40px #00ff00,
      0 0 80px #ffffff;
    letter-spacing: 0.25em;
    word-spacing: 0.5em;
  }

  /* Animaciones */
  @keyframes enterBack {
    0% {opacity:0; transform: translateZ(-500px) scale(0);}
    100% {opacity:1; transform: translateZ(0) scale(1);}
  }

  @keyframes flipOut {
    0% {opacity:1; transform: rotateY(0);}
    100% {opacity:0; transform: rotateY(180deg);}
  }

  @keyframes enterFrontScreen {
    0% {opacity:0; transform: translateZ(1000px) scale(0.2);}
    60% {opacity:1; transform: translateZ(200px) scale(1.3);}
    100% {opacity:1; transform: translateZ(0) scale(1);}
  }

  @keyframes zoomIn {
    0% {opacity:0; transform: scale(0.5);}
    100% {opacity:1; transform: scale(1.3);}
  }

  @keyframes explodeOut {
    0% {opacity:1; transform: scale(1.3) translate(0,0);}
    100% {opacity:0; transform: scale(3) translate(var(--x), var(--y));}
  }

  @keyframes neonWarpIn {
    0% {opacity:0; transform: rotateZ(-45deg) scale(0.2);}
    50% {opacity:1; transform: rotateZ(10deg) scale(1.3);}
    100% {opacity:1; transform: rotateZ(0) scale(1);}
  }

  @keyframes pulseFade {
    0% {opacity:1; text-shadow: 0 0 20px #aaff00, 0 0 40px #00ff80;}
    25% {opacity:1; text-shadow: 0 0 40px #ffffff, 0 0 80px #aaff00;}
    50% {opacity:1; text-shadow: 0 0 20px #00ff00, 0 0 40px #ffffff;}
    75% {opacity:1; text-shadow: 0 0 60px #ffffff, 0 0 100px #00ff80;}
    100% {opacity:0; transform: scale(1.2);}
  }
/* Solo mobile */
@media (max-width: 768px) {
  body {
    height: auto; /* evita que se corte en pantallas pequeñas */
    padding: 20px;
    overflow-y: auto; /* permite scroll si el contenido excede */
    flex-direction: column; /* mejor distribución en mobile */
  }

  .container {
    font-size: 1.8em; /* texto más equilibrado en mobile */
    line-height: 1.2;
  }

  .souleducation {
    letter-spacing: 0.02em; /* menos separación */
  }

  .jamiroquai {
    letter-spacing: 0.05em;
  }

  .cocreada {
    letter-spacing: 0.15em;
    word-spacing: 0.3em;
  }
}
  
  
</style>
</head>
<body>
<div class="container" id="anim"></div>

<script>
const container = document.getElementById('anim');
const words = [
  {text:"SOULEDUCATION", className:"souleducation", mode:"back"},
  {text:"JAMIROQUAI", className:"jamiroquai", mode:"front"},
  {text:"UNA EXPERIENCIA\nCOCREADA CON IA", className:"cocreada", mode:"neonBlock"}
];
let index = 0;

function animateWord(wordObj) {
  container.innerHTML = "";

  if(wordObj.mode === "neonBlock"){
    // Animar la frase completa como bloques de palabras
    const lines = wordObj.text.split("\n");
    lines.forEach((line) => {
      const lineDiv = document.createElement("div");
      lineDiv.style.display = "block";
      line.split(" ").forEach((word, i) => {
        const span = document.createElement("span");
        span.className = wordObj.className;
        span.textContent = word;
        lineDiv.appendChild(span);
        lineDiv.appendChild(document.createTextNode(" "));

        span.style.animation = `neonWarpIn 1s ease-out forwards ${i*0.2}s, pulseFade 1.5s ease forwards ${2 + i*0.2}s`;
      });
      container.appendChild(lineDiv);
    });
  } else {
    // Mantener animación original por letras
    [...wordObj.text].forEach((letter,i)=>{
      if(letter === "\n"){ 
        container.appendChild(document.createElement("br"));
        return;
      }
      const span = document.createElement("span");
      span.className = "letter " + wordObj.className;
      span.textContent = letter === " " ? "\u00A0" : letter;
      container.appendChild(span);

      if(wordObj.mode==="back"){
        span.style.animation = `enterBack 0.8s ease forwards ${i*0.1}s, flipOut 0.8s ease forwards ${2 + i*0.15}s`;
      } else if(wordObj.mode==="front"){
        span.style.animation = `zoomIn 1s ease-out forwards ${i*0.1}s`;
      }
    });

    if(wordObj.mode==="front"){
      setTimeout(()=>{
        container.childNodes.forEach((span,i)=>{
          const x = (Math.random()*400 - 200) + "px";
          const y = (Math.random()*400 - 200) + "px";
          span.style.setProperty('--x', x);
          span.style.setProperty('--y', y);
          span.style.animation = `explodeOut 1s ease-in-out forwards ${i*0.05}s`;
        });
      },2500);
    }
  }
}

function loop(){
  const pos = index % 3;
  animateWord(words[pos]);
  if (pos == 0) {  
    setTimeout(loop, 4000);
  }
  if (pos == 1) {
    setTimeout(loop, 4000);  
  }
  if (pos == 2) { 
    setTimeout(loop, 6000);
  }
  index++;
}

loop();
</script>
</body>
</html>
