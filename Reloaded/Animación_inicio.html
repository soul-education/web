<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Souleducation Timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
<style>
  body {
    background: black;
    color: white;
    font-family: 'Orbitron', sans-serif;
    text-align: center;
    overflow: hidden;
  }
  .intro {
    font-family: 'Monoton', cursive;
    font-size: 3em;
    margin-top: 20%;
    animation: enterFromBack 2s forwards ease-out;
  }
  @keyframes enterFromBack {
    0%   { opacity: 0; transform: scale(0.1) translateZ(-800px); }
    100% { opacity: 1; transform: scale(1) translateZ(0); }
  }
  .fadeOut {
    animation: exitForward 2s forwards ease-in-out;
  }
  @keyframes exitForward {
    0%   { opacity: 1; transform: scale(1) translateZ(0); }
    100% { opacity: 0; transform: scale(2) translateZ(600px); }
  }
  .album {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    opacity: 0;
    max-width: 400px;
    border: 2px solid white;
    padding: 10px;
    border-radius: 10px;
    background: linear-gradient(135deg, #111, #333);
    box-shadow: 0 0 20px cyan;
    text-align: center;
  }
  .album img {
    max-width: 100%;
    border-radius: 8px;
  }
  .album h2 {
    margin: 10px 0 0;
    font-size: 1.2em;
    color: #0ff;
  }
  .show {
    animation: appear 1s forwards ease-out;
  }
  @keyframes appear {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  .hide {
    animation: fadeOutQuick 0.8s forwards ease-in;
  }
  @keyframes fadeOutQuick {
    from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    to   { opacity: 0; transform: translate(-50%, -50%) scale(0.9); }
  }
  /* efecto especial para la última carátula */
  .finalShow {
    animation: finalPulse 2s forwards ease-out;
  }
  @keyframes finalPulse {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.8); box-shadow: 0 0 0px cyan; }
    50%  { opacity: 1; transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 0 40px magenta; }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 20px cyan; }
  }
</style>
</head>
<body>
  <div id="intro" class="intro">BIENVENIDOS<br>A<br>SOULEDUCATION</div>

  <div id="timeline">
    <div class="album"><img src="caratulas/1_Emergency_on_Planet_Earth.jpg"><h2>1993 - Emergency on Planet Earth</h2></div>
    <div class="album"><img src="caratulas/2_The_Return_of_the_Space_Cowboy.jpg"><h2>1994 - The Return of the Space Cowboy</h2></div>
    <div class="album"><img src="caratulas/3_Travelling_Without_Moving.jpg"><h2>1996 - Travelling Without Moving</h2></div>
    <div class="album"><img src="caratulas/4_Synkronized.jpg"><h2>1999 - Synkronized</h2></div>
    <div class="album"><img src="caratulas/5_A_Funk_Odyssey.jpg"><h2>2001 - A Funk Odyssey</h2></div>
    <div class="album"><img src="caratulas/6_Dynamite.jpg"><h2>2005 - Dynamite</h2></div>
    <div class="album"><img src="caratulas/7_Rock_Dust_Light_Star.jpg"><h2>2010 - Rock Dust Light Star</h2></div>
    <div class="album"><img src="caratulas/8_Automaton.jpg"><h2>2017 - Automaton</h2></div>
  </div>

<script>
  // Animación inicial
  setTimeout(() => {
    document.getElementById('intro').classList.add('fadeOut');
    setTimeout(() => {
      document.getElementById('intro').style.display = 'none';
      // Mostrar álbumes uno por uno en el mismo lugar
      const albums = document.querySelectorAll('.album');
      let i = 0;
      function showAlbum() {
        albums[i].classList.add('show');
        setTimeout(() => {
          albums[i].classList.add('hide');
          setTimeout(() => {
            albums[i].style.display = 'none';
            i++;
            if (i < albums.length) {
              showAlbum();
            } else {
              // Mostrar la carátula final fija con efecto especial
              const final = document.createElement('div');
              final.className = 'album finalShow';
              final.innerHTML = `
                <img src="caratulas/9_NoName.png">
                <h2>2026 - ¿Heels of Steel?</h2>
              `;
              document.getElementById('timeline').appendChild(final);
            }
          }, 800); // salida rápida
        }, 1500); // tiempo visible
      }
      showAlbum();
    }, 2000);
  }, 3000);
</script>
</body>
</html>
