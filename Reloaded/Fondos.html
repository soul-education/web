<title>Wallpapers Jamiroquai</title>
<style>
body {
  margin: 0;
  text-align: center;            
  font-family: 'Roboto', Verdana, Geneva, sans-serif; 
  color: #fff;
  overflow-x: hidden;
  background-color: #2a1b5c;
  line-height: 1.6;
  font-size: 1.1em;
}

/* Subtítulos con efecto neón */
h2, h3 {
  font-family: 'Roboto', sans-serif;
  font-weight: 900; 
  font-size: 2em;   
  color: #ff00aa;   
  -webkit-text-stroke: 2px #2a1b5c; 
  text-shadow: 
      0 0 10px #ff00aa,
      0 0 20px #ff00aa,
      0 0 40px #ff00aa;
  margin-top: 40px;
  text-transform: uppercase; 
  letter-spacing: 2px;       
}

h1.fondos-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 4em;
  text-align: center;
  letter-spacing: 4px;

  /* Gradiente animado */
  background: linear-gradient(270deg, #ff00aa, #00ffe0, #ffff00, #ff6600);
  background-size: 800% 800%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;

  animation: gradientFlow 10s ease infinite, neonPulse 2s infinite alternate;
}

/* Animación del gradiente */
@keyframes gradientFlow {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Efecto de neón pulsante */
@keyframes neonPulse {
  from {
    text-shadow: 0 0 10px #ff00aa, 0 0 20px #ff00aa, 0 0 40px #ff00aa;
    transform: scale(1);
  }
  to {
    text-shadow: 0 0 20px #00ffe0, 0 0 40px #00ffe0, 0 0 80px #00ffe0;
    transform: scale(1.05);
  }
}  

table {
  border-collapse: collapse;
}
td {
  padding: 15px;
}
a img {
  max-width: 200px;
  border-radius: 8px;
  box-shadow: 0 0 10px #ff00aa;
  transition: transform 0.2s;
}
a img:hover {
  transform: scale(1.05);
}

/* Mobile */
@media (max-width: 768px) {
  body {
    padding: 15px;
    font-size: 1em;
  }

  h1.fondos-title {
    font-size: 2.2em;
    letter-spacing: 2px;
  }

  h2, h3 {
    font-size: 1.4em;
    letter-spacing: 1px;
  }

  table, tr, td {
    display: block;
    text-align: center;
  }

  a img {
    max-width: 100%;
  }

  td {
    width: 50%;
    float: left;
    padding: 8px;
  }
}

/* Desktop */
@media (min-width: 1080px) {
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-left: 0;
    padding-right: 0;
  }

  table {
    margin: 0 auto;
    width: auto;
  }
}

  
</style>
