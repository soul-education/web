<div class="iframe-overlay">
  <iframe id="contentFrame" src="Inicio.html"></iframe>
</div>

<script>
  function cargarPagina(pagina) {
    document.getElementById("contentFrame").src = pagina;
  }

  document.querySelectorAll("nav a[data-pagina]").forEach(enlace => {
    enlace.addEventListener("click", function(e){
      e.preventDefault();
      const pagina = this.getAttribute("data-pagina");
      cargarPagina(pagina);
    });
  });

    // Toggle hamburguesa
  const hamburger = document.querySelector(".hamburger");
  const menu = document.querySelector(".menu");
  hamburger.addEventListener("click", () => {
    menu.classList.toggle("open");
  });

  // Toggle submenús en mobile
  document.querySelectorAll(".dropdown > a").forEach(link => {
    link.addEventListener("click", function(e) {
      if (window.innerWidth <= 768) {
        e.preventDefault(); // evita navegar
        this.parentElement.classList.toggle("open");
      }
    });
  });
</script>
