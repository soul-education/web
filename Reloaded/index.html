<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Souleducation Timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Oswald:wght@700&family=Orbitron:wght@700&family=Monoton&display=swap" rel="stylesheet">
<style>
:root {
  /* Variables globales */
  --font-min: 1.2em;
  --font-max: 3em;
  --font-mobile: 1em;
  --anim-speed: 1s;        /* velocidad base de animaciones */
  --anim-speed-long: 1.2s; /* velocidad más larga */
}

body {
  background: black;
  color: white;
  font-family: 'Orbitron', sans-serif;
  text-align: center;
  overflow: hidden;
  height: 100vh;
  margin: 0;
}

/* contenedor de textos centrado vertical y horizontal */
.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: clamp(var(--font-min), 5vw, var(--font-max));
  perspective: 1000px;
  text-align: center;
  line-height: 1.4;
  word-wrap: break-word;
  max-width: 90%;
  white-space: pre-line; /* respeta saltos de línea */
}

/* letras animadas */
.letter {
  display: inline-block;
  opacity: 0;
  transform: translateY(100px) scale(0);
  animation-fill-mode: forwards;
}

.souleducation {
  font-family: 'Monoton', cursive;
  color: #fff;
  text-shadow: 0 0 20px #ff00aa, 0 0 40px cyan;
  letter-spacing: 0.1em;
}

.cocreada {
  font-family: 'Orbitron', sans-serif;
  color: #fff;
  text-shadow: 0 0 20px #0ff, 0 0 40px #f0f;
  letter-spacing: 0.25em;
  word-spacing: 0.5em;
}

@keyframes enterBack {
  0% {opacity:0; transform: translateZ(-500px) scale(0);}
  100% {opacity:1; transform: translateZ(0) scale(1);}
}
@keyframes flipOut {
  0% {opacity:1; transform: rotateY(0);}
  100% {opacity:0; transform: rotateY(180deg);}
}
@keyframes neonWarpIn {
  0% {opacity:0; transform: rotateZ(-45deg) scale(0.2);}
  50% {opacity:1; transform: rotateZ(10deg) scale(1.3);}
  100% {opacity:1; transform: rotateZ(0) scale(1);}
}
@keyframes spiralOut {
  0% {opacity:1; transform: rotate(0deg) scale(1);}
  100% {opacity:0; transform: rotate(720deg) scale(0);}
}

/* grilla de discos */
#timeline {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-gap: 20px;
  justify-items: center;
  align-items: center;
  margin-top: 20px;
  height: auto;
}

.album {
  opacity: 0;
  max-width: 180px;
  border: 2px solid #39ff14;
  padding: 10px;
  border-radius: 10px;
  background: linear-gradient(135deg, #111, #333);
  box-shadow: 0 0 30px #39ff14, 0 0 60px #ff00aa;
  text-align: center;
}
.album img {
  max-width: 100%;
  border-radius: 8px;
  box-shadow: 0 0 20px cyan, 0 0 40px magenta;
}
.album h2 {
  margin: 10px 0 0;
  font-size: 1em;
  color: #0ff;
  text-shadow: 0 0 10px #ff00aa, 0 0 20px cyan;
}
.show { animation: appearFast var(--anim-speed) forwards ease-out; }
@keyframes appearFast {
  from { opacity: 0; transform: scale(0.3) rotate(-45deg); }
  to   { opacity: 1; transform: scale(1) rotate(0deg); }
}
.hide { animation: fadeOutQuick var(--anim-speed) forwards ease-in; }
@keyframes fadeOutQuick {
  from { opacity: 1; transform: scale(1) rotate(0deg); }
  to   { opacity: 0; transform: scale(0.5) rotate(45deg); }
}
.finalShow {
  opacity: 1;
  max-width: 200px;
  margin: auto;
  grid-column: span 4;
  justify-self: center;
  align-self: center;
  animation: finalPulse var(--anim-speed-long) infinite alternate;
}
.finalShow h2 {
  display: block; /* siempre visible incluso en mobile */
}
@keyframes finalPulse {
  from { opacity: 1; transform: scale(1); box-shadow: 0 0 20px cyan; }
  to   { opacity: 1; transform: scale(1.1); box-shadow: 0 0 60px magenta, 0 0 100px yellow; }
}

#skip {
  position: absolute;
  bottom: 30px;
  width: 100%;
  text-align: center;
}

#skip a {
  font-family: 'Orbitron', sans-serif;
  font-size: 1.5em;
  color: #ff0040;
  text-decoration: none;
  text-shadow: 
    0 0 10px #ff0040,
    0 0 20px #ff0040,
    0 0 40px #ff0040,
    0 0 80px #ff0040;
  transition: transform 0.3s ease, text-shadow 0.3s ease;
}

#skip a:hover {
  transform: scale(1.1);
  text-shadow: 
    0 0 20px #ff0040,
    0 0 40px #ff0040,
    0 0 80px #ff0040,
    0 0 120px #ff0040;
}

/* Solo mobile */
@media (max-width: 768px) {
  .container {
    font-size: clamp(var(--font-mobile), 6vw, 1.6em);
    line-height: 1.2;
    max-width: 95%;
  }

  .souleducation {
    letter-spacing: 0.05em;
  }

  .cocreada {
    letter-spacing: 0.15em;
    word-spacing: 0.3em;
  }

  #timeline {
    grid-template-columns: repeat(2, 1fr);
    grid-gap: 10px;
  }

  .album {
    max-width: 120px;
    padding: 6px;
  }

  .album h2 {
    display: none; /* ocultar nombre en mobile para los discos normales */
  }

  .finalShow h2 {
    display: block; /* pero mostrar siempre el título del álbum inventado */
    font-size: 1em;
  }
}
</style>
</head>
<body>
<div class="container" id="anim"></div>

<div id="skip">
  <a href="index2.html">SALTAR ANIMACIÓN</a>
</div>

<div id="timeline">
  <!-- discos -->
  <div class="album"><img src="caratulas/1_Emergency_on_Planet_Earth.jpg"><h2>1993 - Emergency on Planet Earth</h2></div>
  <div class="album"><img src="caratulas/2_The_Return_of_the_Space_Cowboy.jpg"><h2>1994 - The Return of the Space Cowboy</h2></div>
  <div class="album"><img src="caratulas/3_Travelling_Without_Moving.jpg"><h2>1996 - Travelling Without Moving</h2></div>
  <div class="album"><img src="caratulas/4_Synkronized.jpg"><h2>1999 - Synkronized</h2></div>
  <div class="album"><img src="caratulas/5_A_Funk_Odyssey.jpg"><h2>2001 - A Funk Odyssey</h2></div>
  <div class="album"><img src="caratulas/6_Dynamite.jpg"><h2>2005 - Dynamite</h2></div>
  <div class="album"><img src="caratulas/7_Rock_Dust_Light_Star.jpg"><h2>2010 - Rock Dust Light Star</h2></div>
  <div class="album"><img src="caratulas/8_Automaton.jpg"><h2>2017 - Automaton</h2></div>
</div>

<script>
const container = document.getElementById('anim');
const words = [
  {text:"BIENVENIDOS A SOULEDUCATION RELOADED", className:"souleducation", mode:"back", duration: 3500},
  {text:"UNA EXPERIENCIA COCREADA CON IA", className:"cocreada", mode:"neon", duration: 3000}
];

function animateWord(wordObj, callback) {
  container.innerHTML = "";
  const parts = wordObj.text.split(" ");
  parts.forEach((part)=>{
    if(part.includes("\n")){
      const [first, second] = part.split("\n");
      if(first) {
        const span1 = document.createElement("span");
        span1.className = "letter " + wordObj.className;
        span1.textContent = first;
        container.appendChild(span1);
      }
      container.appendChild(document.createElement("br"));
      if(second) {
        const span2 = document.createElement("span");
        span2.className = "letter " + wordObj.className;
        span2.textContent = second;
        container.appendChild(span2);
      }
    } else {
      const span = document.createElement("span");
      span.className = "letter " + wordObj.className;
      span.textContent = part;
      container.appendChild(span);
      container.appendChild(document.createTextNode(" "));
    }
  });

  const spans = container.querySelectorAll(".letter");
  spans.forEach((span,i)=>{
    if(wordObj.mode==="back"){
      span.style.animation = `enterBack var(--anim-speed) ease forwards ${i*0.06}s, flipOut var(--anim-speed) ease forwards ${2 + i*0.1}s`;
    } else if(wordObj.mode==="neon"){
      span.style.animation = `neonWarpIn var(--anim-speed-long) ease-out forwards ${i*0.06}s, spiralOut var(--anim-speed-long) ease forwards ${3 + i*0.08}s`;
    }
  });

  setTimeout(callback, wordObj.duration);
}

function startTimeline() {
  container.style.display = "none";
  const albums = document.querySelectorAll('.album');

  albums.forEach(album => {
    album.classList.add('show');
  });

  setTimeout(() => {
    albums.forEach(album => {
      album.classList.add('hide');
      album.addEventListener('animationend', () => {
        album.style.display = 'none';
      });
    });

    setTimeout(() => {
      const final = document.createElement('div');
      final.className = 'album finalShow';
      final.innerHTML = `
        <img src="caratulas/9_NoName.png">
        <h2>2026 - ¿Heels of Steel?</h2>
      `;
      const timeline = document.getElementById('timeline');
      timeline.innerHTML = "";
      timeline.style.display = "flex";
      timeline.style.justifyContent = "center";
      timeline.style.alignItems = "center";
      timeline.style.height = "100%";
      timeline.appendChild(final);

      setTimeout(() => {
        window.location.href = "index2.html";
      }, 4000);
    }, 1000);
  }, 2000);
}

animateWord(words[0], () => {
  animateWord(words[1], () => {
    startTimeline();
  });
});
</script>
</body>
</html>
